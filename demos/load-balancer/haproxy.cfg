global
    log stdout format raw local0
    maxconn 256
defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 15s
    timeout server 15s
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
frontend local_demo
    bind *:8080
    default_backend web_nodes
backend web_nodes
    balance roundrobin
    option httpchk GET /healthz
    http-response set-header X-Demo-Backend %[srv_name]
    server web1 web1:80 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
    server web2 web2:80 check inter 1s fall 2 rise 2 resolvers docker init-addr libc,none
