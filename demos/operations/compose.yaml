name: devops-infra-demo
services:
  app:
    image: traefik/whoami:v1.11.0
    restart: unless-stopped
    networks: [internal]
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [internal]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/config.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/config.yml:ro
      - ./certs:/certs:ro
    networks: [internal]
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9091:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]
  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/init.sh first and load .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
  backup:
    image: alpine:3.22.1
    profiles: [tools]
    user: "0:0"
    volumes:
      - grafana-data:/data:ro
      - ./backups:/backup
    entrypoint: ["tar"]
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  grafana-data:
    name: ${GRAFANA_VOLUME:-devops-demo-grafana-data}
  prometheus-data:
